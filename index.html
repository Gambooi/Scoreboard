<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link href="https://fonts.cdnfonts.com/css/cursed-timer-ulil" rel="stylesheet">
    </head>
    <body>
        <div class="container">
            <div>
                <h3 class="team">HOME</h3>
                <p id="score-home" class="score">0</p>
                <div class="score-btn-group">
                    <button id="one-home" class="score-btn" onclick="oneHome()">+1</button>
                    <button id="two-home" class="score-btn" onclick="twoHome()">+2</button>
                    <button id="three-home" class="score-btn" onclick="threeHome()">+3</button>
                </div>
            </div>
            <div>
                <h3 class="team">AWAY</h3>
                <p id="score-away" class="score">0</p>
                <div class="score-btn-group">
                    <button id="one-away" class="score-btn" onclick="oneAway()">+1</button>
                    <button id="two-away" class="score-btn" onclick="twoAway()">+2</button>
                    <button id="three-away" class="score-btn" onclick="threeAway()">+3</button>
                </div>
            </div>
        </div>
        <div class="container">
            <button id="reset-btn" onclick="resetScore()">RESET</button>
        </div>
        <script src="index.js"></script>
    </body>
</html>
